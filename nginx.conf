worker_processes auto;
worker_rlimit_nofile 65535;
events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}
http {
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=20r/s;

    # Fix 9: Per-IP connection limit to mitigate TLS handshake abuse and Slowloris
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;
    log_format json_ml_format escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/ddos_ml_access.log json_ml_format;
    error_log /var/log/nginx/error.log warn;

    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    client_max_body_size 2M;
    large_client_header_buffers 2 1k;

    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name twojadomena.pl localhost;

        ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Fix 9: SSL session caching to mitigate TLS renegotiation attacks
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            limit_req zone=mylimit burst=100 nodelay;

            # Fix 9: Limit concurrent connections per IP
            limit_conn connlimit 50;

            proxy_pass http://127.0.0.1:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}