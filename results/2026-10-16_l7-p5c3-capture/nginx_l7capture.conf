# L7 capture nginx config (docs/L7_GRU_DESIGN.md §6; Phase P3), used by ml/capture_l7.py.
#
# Request handling is IDENTICAL to nginx.conf — the same limit_req/limit_conn, the same
# 5 s header/body timeouts, the same 64 KiB body cap, the same TLS/HTTP2 — because those
# shape the L7 features (status, $request_completion, $limit_req_status). The only
# differences are deliberate and do not change per-request handling:
#   * the l7json access log goes to a FILE (lossless), not the datagram socket: a training
#     capture must not drop lines, and there is no daemon reading a socket during capture;
#   * the upstream is the multi-path l7_webapp (started by capture_l7 on :8080), so URIs
#     and response sizes carry signal (the P2 review found the one-path app carried none).
# `access_log_path` and `listen`/cert paths are the repo defaults; capture_l7 may template
# a copy with a per-dataset log path.

worker_processes auto;
worker_rlimit_nofile 65535;
events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}
http {
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=82r/s;
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;

    log_format l7json escape=json
    '{'
        '"msec":$msec,'
        '"ip":"$remote_addr",'
        '"port":$remote_port,'
        '"conn":$connection,'
        '"creq":$connection_requests,'
        '"proto":"$server_protocol",'
        '"tls":"$ssl_protocol",'
        '"reused":"$ssl_session_reused",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"compl":"$request_completion",'
        '"rt":$request_time,'
        '"uct":"$upstream_connect_time",'
        '"urt":"$upstream_response_time",'
        '"rlen":$request_length,'
        '"bsent":$bytes_sent,'
        '"lreq":"$limit_req_status",'
        '"lconn":"$limit_conn_status",'
        '"ua":"$http_user_agent"'
    '}';

    access_log /var/tmp/ddos_l7_datasets/20261016T145006Z/access.log l7json;
    error_log /var/log/nginx/error.log info;

    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;
    send_timeout 10s;

    client_max_body_size 64k;
    large_client_header_buffers 2 1k;

    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name twojadomena.pl localhost;

        ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            limit_req zone=mylimit burst=133 nodelay;
            limit_conn connlimit 50;

            proxy_pass http://127.0.0.1:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}
