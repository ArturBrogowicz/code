# Profile R: the realistic "unprotected" server of P4 (docs/P4_SLOW_DESIGN.md §4.1, D-S1, D-S8).
#
# Every P4 arm runs on R. It is nginx_l7capture.conf with the knobs of §4.1 set to the
# distribution's and nginx's own defaults, each marked "R:" below; everything else is unchanged.
# Results on R do not transfer to the hardened configurations (nginx.conf, nginx_unprotected.conf,
# nginx_l7capture.conf), nor the reverse. This file serves the arms without limits (C, C', U);
# nginx_profile_r_limits.conf is the same file plus the deployed limit_req / limit_conn, for the
# protected arms (M_def, M_pc, M_tol). tests/test_profile_r.py pins every value statically;
# `nginx -t` needs the VM and is part of the smoke run. The backend is gunicorn_profile_r.py.
#
# The proxy timeouts are nginx's defaults too (P4-05): 60 s each, the values ngx_http_proxy_module.c of
# nginx 1.28.3 falls back to (lines 3716-3723). The harness's 5 s connect and 10 s send and read timeouts
# are hardening: with them a request queued behind R's five busy sync workers ends in a 504 after 10 s,
# which is a property of the hardened server, not of the realistic one this profile stands for (D-S1).

worker_processes 2;            # R: the server's CPU set is CPUs 0-1 ("auto" counts every online CPU)
worker_rlimit_nofile 65535;
events {
    worker_connections 768;    # R: the distribution's default (/etc/nginx/nginx.conf:9); 2 x 768 slots
    use epoll;
    multi_accept on;
}
http {
    # json_ml_format of nginx.conf plus the client port: the daemon's access-log loop reads it, and
    # the per-connection rule takes from it the UA keys of an address and, on :443, which client
    # ports completed a request (§6.3, §7.2).
    log_format json_ml_port escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"port":$remote_port,'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"user_agent":"$http_user_agent"'
    '}';

    log_format l7json escape=json
    '{'
        '"msec":$msec,'
        '"ip":"$remote_addr",'
        '"port":$remote_port,'
        '"conn":$connection,'
        '"creq":$connection_requests,'
        '"proto":"$server_protocol",'
        '"tls":"$ssl_protocol",'
        '"reused":"$ssl_session_reused",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"compl":"$request_completion",'
        '"rt":$request_time,'
        '"uct":"$upstream_connect_time",'
        '"urt":"$upstream_response_time",'
        '"rlen":$request_length,'
        '"bsent":$bytes_sent,'
        '"lreq":"$limit_req_status",'
        '"lconn":"$limit_conn_status",'
        '"ua":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/ddos_ml_access.log json_ml_port;
    access_log /var/log/nginx/l7_capture.log l7json;
    error_log /var/log/nginx/error.log info;

    client_body_timeout 60s;           # R: nginx's default
    client_header_timeout 60s;         # R: nginx's default
    keepalive_timeout 75s;             # R: nginx's default; the distribution file leaves it unset
    send_timeout 60s;                  # R: nginx's default

    client_max_body_size 1m;           # R: nginx's default; 10m on /upload
    large_client_header_buffers 4 8k;  # R: nginx's default

    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name twojadomena.pl localhost;

        ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://127.0.0.1:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;     # R: nginx's default (P4-05)
            proxy_send_timeout 60s;        # R: nginx's default
            proxy_read_timeout 60s;        # R: nginx's default
        }

        # R: an upload endpoint takes MB-scale bodies and streams them to the backend, so a slow
        # body holds one of the backend's sync workers for as long as it lasts (§4.1).
        location /upload {
            client_max_body_size 10m;
            proxy_request_buffering off;

            proxy_pass http://127.0.0.1:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;     # R: nginx's default (P4-05)
            proxy_send_timeout 60s;        # R: nginx's default
            proxy_read_timeout 60s;        # R: nginx's default
        }
    }

    # nginx's connection counts (active, reading, writing, waiting), sampled every second in
    # server_ns and recorded, not judged (§8). On the loopback only: the clients cannot reach it.
    server {
        listen 127.0.0.1:8081;
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}
